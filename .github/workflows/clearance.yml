name: Clearance Watch

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min (UTC; GitHub may delay a little)
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: clearance-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Run clearance watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python clearance_watch.py

      - name: Save results back to repo
        run: |
          git config user.name "clearance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add last_snapshot.json rendered_page.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update clearance data [skip ci]"
            git push
          fi
